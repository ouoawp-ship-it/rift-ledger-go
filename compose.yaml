services:
  app:
    build:
      context: .
      args:
        GO_VERSION: "1.27.1"
    init: true
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
      LISTEN_ADDR: 0.0.0.0:8080
      ALLOW_PUBLIC_HTTP: "true"
    ports:
      - "127.0.0.1:${HOST_PORT:-8080}:8080"
    volumes:
      - rift_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "3", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  rift_data:
